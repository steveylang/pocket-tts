<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reader">
  <meta name="theme-color" content="#111827">
  <title>Pocket Reader</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <h1>Pocket Reader</h1>
    <textarea id="input" rows="6" placeholder="Paste text or a link" aria-label="Text or link"></textarea>
    <label class="file">Or choose a document
      <input id="file" type="file" accept=".txt,.md,.html,.htm,.pdf">
    </label>
    <div class="row">
      <label>Voice <select id="voice"></select></label>
      <label>Speed
        <input id="speed" type="range" min="0.75" max="2" step="0.05" value="1">
        <output id="speed-label">1.00x</output>
      </label>
    </div>
    <button id="play" type="button">Play</button>
    <p id="status" role="status"></p>
    <section id="player" hidden>
      <h2 id="title"></h2>
      <p id="progress"></p>
      <audio id="audio" controls playsinline preload="auto"></audio>
      <button id="retry" type="button" hidden>Retry this part</button>
      <div class="row">
        <button id="prev" type="button">Back</button>
        <button id="next" type="button">Next</button>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
